<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#f5f5f7; --bg-elev:#ffffff; --text:#1d1d1f; --text-sub:#6e6e73;
  --accent:#0071e3; --border:#d2d2d7; --danger:#ff3b30; --success:#34c759;
  --radius:16px; --shadow:0 4px 24px rgba(0,0,0,.06);
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,sans-serif;
}
[data-theme="dark"]{
  --bg:#000000; --bg-elev:#1c1c1e; --text:#f5f5f7; --text-sub:#98989d;
  --border:#38383a; --shadow:0 4px 24px rgba(0,0,0,.4);
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  background:var(--bg); color:var(--text); font-family:var(--font);
  min-height:100vh; -webkit-font-smoothing:antialiased; transition:background .3s,color .3s;
}
.hidden{display:none !important;}
#login-screen{
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
}
.login-card{
  background:var(--bg-elev); border-radius:var(--radius); box-shadow:var(--shadow);
  padding:40px 32px; width:100%; max-width:380px; text-align:center;
}
.login-card h1{font-size:28px; font-weight:600; margin-bottom:4px;}
.login-card p{color:var(--text-sub); font-size:14px; margin-bottom:28px;}
.field{text-align:left; margin-bottom:16px;}
.field label{font-size:13px; color:var(--text-sub); display:block; margin-bottom:6px;}
.field input{
  width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--border);
  background:var(--bg); color:var(--text); font-size:15px; font-family:var(--font);
  outline:none; transition:border-color .2s;
}
.field input:focus{border-color:var(--accent);}
.btn-primary{
  width:100%; padding:13px; border:none; border-radius:10px; background:var(--accent);
  color:#fff; font-size:15px; font-weight:600; cursor:pointer; transition:opacity .2s;
  font-family:var(--font);
}
.btn-primary:active{opacity:.7;}
.btn-primary:disabled{opacity:.5; cursor:default;}
#login-error{color:var(--danger); font-size:13px; margin-top:12px; min-height:16px;}
#app{display:none; min-height:100vh;}

/* ===== APP SHELL ===== */
.app-shell{display:flex; min-height:100vh;}
.sidebar{
  width:240px; background:var(--bg-elev); border-right:1px solid var(--border);
  display:flex; flex-direction:column; padding:24px 16px; flex-shrink:0;
  position:sticky; top:0; height:100vh;
}
.sidebar .brand{font-size:20px; font-weight:700; padding:0 8px 24px; letter-spacing:-.5px;}
.nav-item{
  display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:10px;
  color:var(--text-sub); font-size:14.5px; font-weight:500; cursor:pointer;
  transition:background .15s,color .15s; margin-bottom:2px; user-select:none;
}
.nav-item svg{width:18px; height:18px; flex-shrink:0;}
.nav-item:hover{background:var(--bg);}
.nav-item.active{background:var(--accent); color:#fff;}
.sidebar-footer{margin-top:auto; display:flex; flex-direction:column; gap:8px;}
.theme-toggle{
  display:flex; align-items:center; justify-content:space-between; padding:10px 12px;
  border-radius:10px; background:var(--bg); font-size:13.5px; color:var(--text-sub); cursor:pointer;
}
.switch{width:38px; height:22px; background:var(--border); border-radius:20px; position:relative; flex-shrink:0; transition:background .2s;}
.switch::after{content:'';position:absolute; width:18px; height:18px; background:#fff; border-radius:50%; top:2px; left:2px; transition:transform .2s; box-shadow:0 1px 3px rgba(0,0,0,.2);}
[data-theme="dark"] .switch{background:var(--accent);}
[data-theme="dark"] .switch::after{transform:translateX(16px);}
.btn-logout{
  padding:10px 12px; border-radius:10px; background:transparent; border:1px solid var(--border);
  color:var(--text-sub); font-size:13.5px; cursor:pointer; font-family:var(--font); text-align:left;
}
.btn-logout:hover{color:var(--danger); border-color:var(--danger);}

.main{flex:1; min-width:0; padding:28px 32px; max-width:1200px;}
.main-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:24px;}
.main-header h2{font-size:24px; font-weight:700; letter-spacing:-.5px;}
.main-header .user-chip{font-size:13px; color:var(--text-sub);}

.topbar{display:none;}
.mobile-nav{display:none;}

.card{background:var(--bg-elev); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px;}
.grid{display:grid; gap:16px;}
.grid-cols-4{grid-template-columns:repeat(4,1fr);}
.grid-cols-2{grid-template-columns:repeat(2,1fr);}

@media (max-width: 900px){
  .grid-cols-4{grid-template-columns:repeat(2,1fr);}
  .sidebar{display:none;}
  .app-shell{flex-direction:column;}
  .topbar{
    display:flex; align-items:center; justify-content:space-between; padding:14px 18px;
    background:var(--bg-elev); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:10;
  }
  .topbar .brand{font-size:18px; font-weight:700;}
  .main{padding:20px 16px 90px; max-width:100%;}
  .mobile-nav{
    display:flex; justify-content:space-around; position:fixed; bottom:0; left:0; right:0;
    background:var(--bg-elev); border-top:1px solid var(--border); padding:8px 4px 20px; z-index:10;
  }
  .mobile-nav .nav-item{flex-direction:column; gap:3px; font-size:10.5px; padding:6px 8px; border-radius:10px; margin:0;}
  .mobile-nav .nav-item.active{background:transparent; color:var(--accent);}
}
@media (min-width: 901px){
  .grid-cols-2{grid-template-columns:repeat(2,1fr);}
}

.btn-secondary{
  padding:9px 16px; border-radius:10px; border:1px solid var(--border); background:var(--bg-elev);
  color:var(--text); font-size:13.5px; font-weight:600; cursor:pointer; font-family:var(--font);
}
.btn-secondary:active{opacity:.7;}
.btn-sm{padding:6px 12px; font-size:12.5px;}
.badge{display:inline-block; padding:3px 9px; border-radius:20px; font-size:11.5px; font-weight:600;}
.badge-pago{background:rgba(52,199,89,.15); color:var(--success);}
.badge-pendente{background:rgba(255,159,10,.15); color:#ff9f0a;}
.badge-vencido{background:rgba(255,59,48,.15); color:var(--danger);}
.item-row{
  display:flex; align-items:center; justify-content:space-between; padding:14px 0;
  border-bottom:1px solid var(--border);
}
.item-row:last-child{border-bottom:none;}
.item-title{font-weight:600; font-size:14.5px;}
.item-sub{font-size:12.5px; color:var(--text-sub); margin-top:2px;}
.item-actions{display:flex; gap:8px; align-items:center;}

.modal-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.4); display:flex; align-items:center; justify-content:center;
  padding:20px; z-index:100;
}
.modal{
  background:var(--bg-elev); border-radius:var(--radius); padding:28px; width:100%; max-width:420px;
  max-height:90vh; overflow-y:auto;
}
.modal h3{font-size:18px; font-weight:700; margin-bottom:18px;}
.modal .field{margin-bottom:14px;}
.modal .field select{
  width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--border);
  background:var(--bg); color:var(--text); font-size:15px; font-family:var(--font); outline:none;
}
.modal-actions{display:flex; gap:10px; margin-top:20px;}
.modal-actions button{flex:1;}
.fab{
  position:fixed; bottom:96px; right:24px; width:52px; height:52px; border-radius:50%;
  background:var(--accent); color:#fff; border:none; font-size:26px; box-shadow:var(--shadow);
  cursor:pointer; z-index:20; display:none;
}
@media (max-width: 900px){ .fab{display:block;} }

.progress-bar{width:100%; height:8px; background:var(--border); border-radius:10px; overflow:hidden; margin:10px 0;}
.progress-fill{height:100%; background:var(--accent); border-radius:10px; transition:width .3s;}
.goal-card{background:var(--bg-elev); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px; margin-bottom:14px;}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <h1>Horizon</h1>

    <div id="login-error"></div>
  </div>

<div id="app">
  <div class="app-shell">
    <aside class="sidebar">

      <nav id="nav-desktop"></nav>
      <div class="sidebar-footer">
        <div class="theme-toggle" id="theme-toggle">

        </div>

    <div style="flex:1; min-width:0; display:flex; flex-direction:column;">

        <div class="brand">Horizon</div>

        <div class="main-header">

        <div id="page-content"></div>
      </main>

    <nav class="mobile-nav" id="nav-mobile"></nav>
  </div>
  <button class="fab" id="fab-add">+</button>
  <div id="modal-root"></div>
</div>

<script>
const SUPABASE_URL = 'https://sotgkmnrmwmvsozspvnv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Ekks5Rl-NzVefdNwJ-r__Q_y9VyGzqX';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  async function dbWrite(promise){
  const { data, error } = await promise;
  if(error){
    alert('Erro ao salvar: ' + error.message);
    throw error;
  }
  return data;
}

const loginScreen = document.getElementById('login-screen');
const appScreen = document.getElementById('app');
const btnLogin = document.getElementById('btn-login');
const loginError = document.getElementById('login-error');

async function doLogin(){
  loginError.textContent = '';
  btnLogin.disabled = true;
  btnLogin.textContent = 'Entrando...';
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  btnLogin.disabled = false;
  btnLogin.textContent = 'Entrar';
  if(error){ loginError.textContent = 'E-mail ou senha inválidos.'; }
}
btnLogin.addEventListener('click', doLogin);
document.getElementById('password').addEventListener('keydown', e => { if(e.key === 'Enter') doLogin(); });

let appInitialized = false;

sb.auth.onAuthStateChange((event, session) => {
  if(session){
    // Mantém currentUser sempre sincronizado, mesmo em refresh de token,
    // mas SEM re-renderizar a interface.
    currentUser = session.user;

    if(!appInitialized){
      // Só inicializa de verdade na primeira vez que existe sessão
      // (login real ou sessão restaurada ao abrir o app).
      loginScreen.classList.add('hidden');
      appScreen.style.display = 'block';
      initApp(session.user);
      appInitialized = true;
    }
    // Eventos como TOKEN_REFRESHED, USER_UPDATED, INITIAL_SESSION (quando já
    // inicializado) caem aqui e não fazem nada além de atualizar currentUser.
  } else {
    // Sessão realmente encerrada (logout ou token inválido) -> volta ao login.
    appInitialized = false;
    loginScreen.classList.remove('hidden');
    appScreen.style.display = 'none';
  }
});

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

const PAGES = [
  { id:'dashboard', label:'Dashboard', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>' },
  { id:'contas', label:'Contas', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg>' },
  { id:'cartoes', label:'Cartões', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>' },
  { id:'receitas', label:'Receitas', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>' },
  { id:'metas', label:'Metas', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>' },
  { id:'investimentos', label:'Investimentos', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l5-6 4 4 8-9"/></svg>' },
  { id:'config', label:'Ajustes', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>' }
];

let currentPage = 'dashboard';
let currentUser = null;

function renderNav(){
  const build = (mobile) => PAGES.map(p => `
    <div class="nav-item ${p.id===currentPage?'active':''}" data-page="${p.id}">
      ${p.icon}<span>${p.label}</span>
    </div>`).join('');
  document.getElementById('nav-desktop').innerHTML = build(false);
  document.getElementById('nav-mobile').innerHTML = PAGES.slice(0,5).map(p => `
    <div class="nav-item ${p.id===currentPage?'active':''}" data-page="${p.id}">
      ${p.icon}<span>${p.label}</span>
    </div>`).join('');
  document.querySelectorAll('[data-page]').forEach(el => {
    el.addEventListener('click', () => goToPage(el.dataset.page));
  });
}

function goToPage(pageId){
  currentPage = pageId;
  document.getElementById('page-title').textContent = PAGES.find(p=>p.id===pageId).label;
  renderNav();
  renderPage(pageId);
  const fab = document.getElementById('fab-add');
  fab.style.display = ['contas','cartoes','receitas','metas','investimentos'].includes(pageId) ? 'block' : 'none';
}

function renderPage(pageId){
  const el = document.getElementById('page-content');
  if(pageId === 'dashboard'){ loadDashboard(el); return; }
  if(pageId === 'contas'){ loadContas(el); return; }
  if(pageId === 'cartoes'){ loadCartoes(el); return; }
  if(pageId === 'receitas'){ loadReceitas(el); return; }
  if(pageId === 'metas'){ loadMetas(el); return; }
  if(pageId === 'investimentos'){ loadInvestimentos(el); return; }
  if(pageId === 'config'){ loadConfig(el); return; }
  el.innerHTML = `<div class="card">Carregando "${pageId}"... (implementado nas próximas etapas)</div>`;
}

function formatBRL(v){
  return (v||0).toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
}
function escapeHtml(str){
  if(str === null || str === undefined) return '';
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function formatPct(v){
  return (v||0).toLocaleString('pt-BR', { maximumFractionDigits:1 }) + '%';
}
function localDateStr(d = new Date()){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function monthRange(offset=0){
  const d = new Date();
  const first = new Date(d.getFullYear(), d.getMonth()+offset, 1);
  const last = new Date(d.getFullYear(), d.getMonth()+offset+1, 0);
  return { start: localDateStr(first), end: localDateStr(last) };
}

async function loadDashboard(el){
  el.innerHTML = `<div class="card">Carregando indicadores...</div>`;

  try{
    const thisM = monthRange(0);
    const lastM = monthRange(-1);
    const sixM = monthRange(-5);
    const uid = currentUser.id;
    const today = localDateStr();

    const [entriesNow, entriesPrev, incomesNow, incomesPrev, goals, investments, overdue, history] = await Promise.all([
      sb.from('bill_entries').select('*, bills(type,name)').eq('user_id', uid).gte('month_ref', thisM.start).lte('month_ref', thisM.end),
      sb.from('bill_entries').select('*').eq('user_id', uid).gte('month_ref', lastM.start).lte('month_ref', lastM.end),
      sb.from('incomes').select('*').eq('user_id', uid).gte('month_ref', thisM.start).lte('month_ref', thisM.end),
      sb.from('incomes').select('*').eq('user_id', uid).gte('month_ref', lastM.start).lte('month_ref', lastM.end),
      sb.from('goals').select('*').eq('user_id', uid),
      sb.from('investments').select('*').eq('user_id', uid),
      sb.from('bill_entries').select('*').eq('user_id', uid).neq('status','pago').lt('due_date', today),
      sb.from('bill_entries').select('*').eq('user_id', uid).eq('status','pago').gte('month_ref', sixM.start).lte('month_ref', thisM.end)
    ]);

    [entriesNow, entriesPrev, incomesNow, incomesPrev, goals, investments, overdue, history].forEach(r => {
      if(r.error) throw r.error;
    });

    const entries = entriesNow.data || [];
    const entriesLast = entriesPrev.data || [];
    const incomesData = incomesNow.data || [];
    const incomesLast = incomesPrev.data || [];
    const goalsData = goals.data || [];
    const investData = investments.data || [];

    const sum = (arr, f=x=>x.value) => arr.reduce((a,c)=>a+Number(f(c)||0), 0);

    const receitas = sum(incomesData);
    const receitasAnt = sum(incomesLast);
    const despesasPrevistas = sum(entries);
    const despesasPagas = sum(entries.filter(e => e.status === 'pago'));
    const despesasAnt = sum(entriesLast.filter(e => e.status === 'pago'));
    const vencidas = overdue.data || [];
    const proximas = entries.filter(e => e.status !== 'pago' && e.due_date && e.due_date >= today && e.due_date <= thisM.end);
    const pagas = entries.filter(e => e.status === 'pago');
    const saldo = receitas - despesasPagas;
    const fluxoCaixa = receitas - despesasPrevistas;
    const percentComprometido = receitas > 0 ? (despesasPrevistas/receitas*100) : 0;
    const patrimonioInvestido = sum(investData);

    const reservaGoal = goalsData.find(g => (g.name||'').toLowerCase().includes('reserva'));
    const reservaAtual = reservaGoal ? Number(reservaGoal.current_value||0) : 0;
    const reservaAlvo = reservaGoal ? Number(reservaGoal.target_value||0) : 0;
    const reservaPct = reservaAlvo > 0 ? (reservaAtual/reservaAlvo*100) : 0;

    const deltaReceitas = receitasAnt > 0 ? ((receitas-receitasAnt)/receitasAnt*100) : 0;
    const deltaDespesas = despesasAnt > 0 ? ((despesasPagas-despesasAnt)/despesasAnt*100) : 0;

    const cards = [
      { label:'Saldo do mês', value: formatBRL(saldo), sub: null },
      { label:'Receitas', value: formatBRL(receitas), sub: fmtDelta(deltaReceitas, true) },
      { label:'Despesas pagas', value: formatBRL(despesasPagas), sub: fmtDelta(deltaDespesas, false) },
      { label:'Fluxo de caixa previsto', value: formatBRL(fluxoCaixa), sub: null },
      { label:'Comprometimento da renda', value: formatPct(percentComprometido), sub: null },
      { label:'Patrimônio investido', value: formatBRL(patrimonioInvestido), sub: null },
      { label:'Reserva de emergência', value: formatBRL(reservaAtual), sub: reservaAlvo ? `${formatPct(reservaPct)} da meta` : 'Sem meta definida' },
      { label:'Contas vencidas', value: vencidas.length, sub: vencidas.length ? 'Requer atenção' : 'Tudo em dia', danger: vencidas.length>0 },
      { label:'Contas a vencer (este mês)', value: proximas.length, sub: null },
      { label:'Contas pagas (este mês)', value: `${pagas.length}/${entries.length}`, sub: null }
    ];

    // Separação por tipo (fixas / cartões / parcelas) - só este mês
    const typeLabel = { fixa:'Contas fixas', cartao:'Cartões', parcelada:'Parcelamentos' };
    const byType = { fixa:0, cartao:0, parcelada:0 };
    entries.forEach(e => {
      const t = e.bills?.type || 'fixa';
      if(byType[t] === undefined) byType[t] = 0;
      byType[t] += Number(e.value||0);
    });
    const typeCards = Object.keys(byType).filter(t => byType[t] > 0).map(t => `
      <div class="card">
        <div style="font-size:13px; color:var(--text-sub); margin-bottom:8px;">${typeLabel[t] || t}</div>
        <div style="font-size:20px; font-weight:700;">${formatBRL(byType[t])}</div>
        <div style="font-size:12.5px; color:var(--text-sub); margin-top:4px;">${despesasPrevistas>0 ? formatPct(byType[t]/despesasPrevistas*100) : '0%'} do total do mês</div>
      </div>`).join('');

    // Histórico dos últimos 6 meses (gasto pago por mês)
    const histByMonth = {};
    for(let i=5; i>=0; i--){
      const { start } = monthRange(-i);
      histByMonth[start.slice(0,7)] = 0;
    }
    (history.data || []).forEach(e => {
      const key = (e.month_ref||'').slice(0,7);
      if(histByMonth[key] !== undefined) histByMonth[key] += Number(e.value||0);
    });
    const monthNames = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
    const histEntries = Object.entries(histByMonth);
    const maxVal = Math.max(1, ...histEntries.map(([,v]) => v));
    const chartBars = histEntries.map(([key, val]) => {
      const [y, m] = key.split('-');
      const h = Math.max(4, (val / maxVal) * 120);
      return `
        <div style="display:flex; flex-direction:column; align-items:center; gap:6px; flex:1;">
          <div style="font-size:11px; color:var(--text-sub);">${val>0 ? formatBRL(val).replace('R$','') : ''}</div>
          <div style="width:70%; height:${h}px; background:var(--accent); border-radius:6px 6px 0 0;"></div>
          <div style="font-size:11.5px; color:var(--text-sub);">${monthNames[parseInt(m,10)-1]}</div>
        </div>`;
    }).join('');

    el.innerHTML = `
      <div class="grid grid-cols-4" style="margin-bottom:16px;">
        ${cards.map(c => `
          <div class="card">
            <div style="font-size:13px; color:var(--text-sub); margin-bottom:8px;">${c.label}</div>
            <div style="font-size:22px; font-weight:700; ${c.danger?'color:var(--danger);':''}">${c.value}</div>
            ${c.sub ? `<div style="font-size:12.5px; color:var(--text-sub); margin-top:4px;">${c.sub}</div>` : ''}
          </div>`).join('')}
      </div>

      ${typeCards ? `
      <div style="font-size:14px; font-weight:600; margin:20px 0 10px;">Despesas do mês por tipo</div>
      <div class="grid grid-cols-4" style="margin-bottom:16px;">${typeCards}</div>` : ''}

      <div style="font-size:14px; font-weight:600; margin:20px 0 10px;">Gastos pagos - últimos 6 meses</div>
      <div class="card">
        <div style="display:flex; align-items:flex-end; gap:8px; height:150px;">${chartBars}</div>
      </div>
    `;
  } catch(err){
    console.error('Erro ao carregar dashboard:', err);
    el.innerHTML = `<div class="card" style="color:var(--danger);">
      Não foi possível carregar o dashboard.<br>
      <span style="font-size:12.5px; color:var(--text-sub);">${escapeHtml(err.message || String(err))}</span>
    </div>`;
  }
}

function openModal(html){
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal">${html}</div>
    </div>`;
  document.getElementById('modal-overlay').addEventListener('click', (e) => {
    if(e.target.id === 'modal-overlay') closeModal();
  });
}
function closeModal(){
  document.getElementById('modal-root').innerHTML = '';
}

function statusBadge(entry){
  const today = localDateStr();
  if(entry.status === 'pago') return '<span class="badge badge-pago">Pago</span>';
  if(entry.due_date && entry.due_date < today) return '<span class="badge badge-vencido">Vencido</span>';
  return '<span class="badge badge-pendente">Pendente</span>';
}

  contas: () => openAddBillModal(),

async function loadContas(el){
  el.innerHTML = `<div class="card">Carregando contas...</div>`;
  const uid = currentUser.id;

  const { data: bills } = await sb.from('bills').select('*').eq('user_id', uid).neq('type', 'cartao').order('name');
  const { data: entries } = await sb.from('bill_entries').select('*').eq('user_id', uid).order('due_date', { ascending:false });

  const latestByBill = {};
  (entries||[]).forEach(e => { if(!latestByBill[e.bill_id]) latestByBill[e.bill_id] = e; });

  const rows = (bills||[]).map(b => {
    const e = latestByBill[b.id];
    return `
      <div class="item-row">
        <div>
          <div class="item-title">${escapeHtml(b.name)}</div>
          <div class="item-sub">${escapeHtml(b.category) || 'Sem categoria'} ${e ? '· vence ' + formatDate(e.due_date) : ''}</div>
        </div>
        <div class="item-actions">
          ${e ? statusBadge(e) : '<span class="item-sub">Sem lançamento</span>'}
          <span style="font-weight:600; min-width:90px; text-align:right;">${e ? formatBRL(e.value) : ''}</span>
          ${e && e.status !== 'pago' ? `<button class="btn-secondary btn-sm" onclick="markPaid('${e.id}')">Marcar pago</button>` : ''}
          <button class="btn-secondary btn-sm" onclick="openAddEntryModal('${b.id}', '${(e?e.value:0)}')">Lançar mês</button>
        </div>
      </div>`;
  }).join('') || '<div class="item-sub">Nenhuma conta cadastrada ainda.</div>';

  el.innerHTML = `
    <div class="card" style="margin-bottom:16px; display:flex; justify-content:flex-end;">
      <button class="btn-primary" style="width:auto; padding:10px 18px;" onclick="openAddBillModal()">+ Nova conta</button>
    </div>
    <div class="card">${rows}</div>
  `;
}

function fmtDelta(pct, positiveIsGood){
  if(!pct) return 'Sem comparativo anterior';
  const up = pct > 0;
  const good = positiveIsGood ? up : !up;
  const color = good ? 'var(--success)' : 'var(--danger)';
  const arrow = up ? '▲' : '▼';
  return `<span style="color:${color}">${arrow} ${formatPct(Math.abs(pct))}</span> vs mês anterior`;
}

function formatDate(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

async function saveInvestment(){
  const type = document.getElementById('f-inv-type').value;
  const name = document.getElementById('f-inv-name').value.trim();
  const value = parseFloat(document.getElementById('f-inv-value').value || 0);
  const date = document.getElementById('f-inv-date').value;
  if(!name || !value) return;

  await dbWrite(sb.from('investments').insert({ user_id: currentUser.id, type, name, value, date }));
  closeModal();
  loadInvestimentos(document.getElementById('page-content'));
}

async function deleteInvestment(id){
  await dbWrite(sb.from('investments').delete().eq('id', id));
  loadInvestimentos(document.getElementById('page-content'));
}

async function loadConfig(el){
  el.innerHTML = `<div class="card">Carregando...</div>`;
  const { data: profile } = await sb.from('profiles').select('*').eq('id', currentUser.id).maybeSingle();

  el.innerHTML = `
    <div class="card" style="margin-bottom:16px;">
      <div class="item-title" style="margin-bottom:14px;">Perfil</div>
      <div class="field"><label>Nome</label><input type="text" id="f-profile-name" value="${escapeHtml(profile?.name) || ''}"></div>
      <div class="field"><label>E-mail</label><input type="text" value="${currentUser.email}" disabled></div>
      <button class="btn-primary" style="width:auto; padding:10px 18px;" onclick="saveProfile()">Salvar perfil</button>
    </div>
    <div class="card">
      <div class="item-title" style="margin-bottom:10px;">Dados</div>
      <div class="item-sub" style="margin-bottom:14px;">Exporte uma cópia de segurança de todos os seus dados em JSON.</div>
      <button class="btn-secondary" onclick="exportData()">Exportar dados</button>
    </div>
  `;
}

async function saveProfile(){
  const name = document.getElementById('f-profile-name').value.trim();
  await dbWrite(sb.from('profiles').upsert({ id: currentUser.id, name }));
  alert('Perfil salvo.');
}

async function exportData(){
  const uid = currentUser.id;
  const [bills, entries, incomes, goals, investments] = await Promise.all([
    sb.from('bills').select('*').eq('user_id', uid),
    sb.from('bill_entries').select('*').eq('user_id', uid),
    sb.from('incomes').select('*').eq('user_id', uid),
    sb.from('goals').select('*').eq('user_id', uid),
    sb.from('investments').select('*').eq('user_id', uid)
  ]);
  const payload = {
    bills: bills.data, bill_entries: entries.data, incomes: incomes.data,
    goals: goals.data, investments: investments.data, exported_at: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `horizon-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function openAddCardModal(){
  openModal(`
    <h3>Novo cartão</h3>
    <div class="field"><label>Nome do cartão</label><input type="text" id="f-card-name" placeholder="Ex: Nubank"></div>
    <div class="field"><label>Valor da fatura atual</label><input type="number" step="0.01" id="f-card-value"></div>
    <div class="field"><label>Vencimento</label><input type="date" id="f-card-due"></div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn-primary" onclick="saveCard()">Salvar</button>
    </div>
  `);
}

async function saveCard(){
  const name = document.getElementById('f-card-name').value.trim();
  const value = parseFloat(document.getElementById('f-card-value').value || 0);
  const due = document.getElementById('f-card-due').value;
  if(!name || !due) return;

 const card = await dbWrite(sb.from('bills').insert({
    user_id: currentUser.id, name, category:'Cartão de Crédito', type:'cartao'
  }).select().single());

  await dbWrite(sb.from('bill_entries').insert({
    bill_id: card.id, user_id: currentUser.id, month_ref: due, value, due_date: due, status:'pendente'
  }));

  closeModal();
  loadCartoes(document.getElementById('page-content'));
}

function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('horizon-theme', theme);
  const label = document.getElementById('theme-label');
  if(label) label.textContent = theme === 'dark' ? 'Modo claro' : 'Modo escuro';
}

function toggleTheme(){
  const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  applyTheme(current === 'dark' ? 'light' : 'dark');
}

document.getElementById('theme-toggle').addEventListener('click', toggleTheme);
document.getElementById('theme-toggle-mobile').addEventListener('click', toggleTheme);
document.getElementById('btn-logout').addEventListener('click', async () => {
  await sb.auth.signOut();
});

function initApp(user){
  currentUser = user;
  document.getElementById('user-chip').textContent = user.email;
  const savedTheme = localStorage.getItem('horizon-theme') || 'light';
  applyTheme(savedTheme);
  renderNav();
  renderPage(currentPage);
  document.getElementById('fab-add').style.display = (currentPage === 'contas') ? 'block' : 'none';
}
</script>
</body>
</html>
